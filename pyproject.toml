[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "micrograph-synth"
version = "0.1.0"
description = "Synthetic micrographs with pixel-perfect instance ground truth"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.23", "pillow>=9.0"]

[project.scripts]
micrograph-synth = "micrograph_synth.cli:main"

[tool.setuptools]
packages = ["micrograph_synth"]
